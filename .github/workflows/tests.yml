name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (CPU-only torch)
        run: |
          uv venv --python 3.12
          uv pip install --torch-backend cpu -e ".[summarize]" pytest ruff
      - run: .venv/bin/ruff check .
      # tests on real checkpoints skip here: the models are not in the runner's HF cache
      - run: .venv/bin/pytest -q
